name: Verify proof package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Complete proof verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the submitted proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Run all proof obligations with fresh enumeration
        run: python verify.py --seconds-per-order 300
